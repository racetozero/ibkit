apiVersion: v1
kind: Service
metadata:
  name: {{ include "ibkit.name" . }}
  labels:
    {{- include "ibkit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ibkit.selector" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.gateway.apiPort }}
      targetPort: api
    {{- if .Values.controlApi.enabled }}
    - name: control
      port: {{ .Values.controlApi.port }}
      targetPort: control
    {{- end }}
