apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ibkit.name" . }}
  labels:
    {{- include "ibkit.labels" . | nindent 4 }}
data:
  config.toml: |
    executable = "/opt/ibgateway/ibgateway"
    agent = "/usr/local/lib/libibkit_gateway_agent.so"
    state_dir = "/var/lib/ibkit/state"
    settings_dir = "/var/lib/ibkit/settings"
    trading_mode = {{ .Values.gateway.tradingMode | toJson }}
    api_port = {{ .Values.gateway.apiPort }}
    read_only_api = {{ .Values.gateway.readOnlyApi }}
    api_log = {{ .Values.gateway.apiLog }}
    allow_remote_api = {{ .Values.gateway.allowRemoteApi }}
    incoming_connection = {{ .Values.gateway.incomingConnection | toJson }}
    api_listen = {{ printf "0.0.0.0:%v" .Values.gateway.forwardPort | toJson }}
    auto_recover = {{ .Values.gateway.autoRecover }}
    recovery_attempts = {{ .Values.gateway.recoveryAttempts }}
    recovery_delay_secs = {{ .Values.gateway.recoveryDelaySeconds }}
    recovery_max_delay_secs = {{ .Values.gateway.recoveryMaxDelaySeconds }}
    api_probe_interval_secs = {{ .Values.gateway.apiProbeIntervalSeconds }}
    api_failure_timeout_secs = {{ .Values.gateway.apiFailureTimeoutSeconds }}
    region = {{ .Values.gateway.region | toJson }}
    bypass_order_precautions = {{ .Values.gateway.bypassOrderPrecautions }}
    accept_order_warnings = {{ .Values.gateway.acceptOrderWarnings }}
    existing_session = {{ .Values.gateway.existingSession | toJson }}
    export_logs = {{ .Values.gateway.exportLogs }}
    restart_time = {{ .Values.gateway.restartTime | toJson }}
    initialization_timeout_secs = {{ .Values.gateway.initializationTimeoutSeconds }}
    soft_restart_timeout_secs = {{ .Values.gateway.softRestartTimeoutSeconds }}
    shutdown_timeout_secs = {{ .Values.gateway.shutdownTimeoutSeconds }}
    second_factor_timeout_secs = {{ .Values.gateway.secondFactorTimeoutSeconds }}
    second_factor_attempts = {{ .Values.gateway.secondFactorAttempts }}
    unknown_dialog_timeout_secs = {{ .Values.gateway.unknownDialogTimeoutSeconds }}
    passkey_authenticate = {{ .Values.gateway.passkeyAuthenticate }}
    {{- with .Values.gateway.javaHeapMb }}
    java_heap_mb = {{ . }}
    {{- end }}
    {{- if not (kindIs "invalid" .Values.gateway.masterClientId) }}
    master_client_id = {{ .Values.gateway.masterClientId }}
    {{- end }}
    {{- with .Values.gateway.apiAllowedSources }}
    api_allowed_sources = {{ . | toJson }}
    {{- end }}
    max_login_failures = {{ .Values.gateway.maxLoginFailures }}
    dismiss_password_expiry_warning = {{ .Values.gateway.dismissPasswordExpiryWarning }}
    {{- with .Values.gateway.closedownAt }}
    closedown_at = {{ . | toJson }}
    {{- end }}
    {{- with .Values.gateway.coldRestartAt }}
    cold_restart_at = {{ . | toJson }}
    {{- end }}
    {{- if .Values.vnc.enabled }}
    vnc_listen = {{ printf "127.0.0.1:%v" .Values.vnc.port | toJson }}
    vnc_password_file = "/run/ibkit-vnc/password"
    {{- end }}
    username_file = "/run/ibkit-credentials/username"
    password_file = "/run/ibkit-credentials/password"
    {{- if .Values.credentials.totpSecretKey }}
    totp_secret_file = "/run/ibkit-credentials/totp"
    {{- end }}
    manage_display = true
    {{- if .Values.controlApi.enabled }}
    control_listen = {{ printf "0.0.0.0:%v" .Values.controlApi.port | toJson }}
    control_token_file = "/run/ibkit-control/token"
    {{- end }}
