{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ibkit.name" . }}
  labels:
    {{- include "ibkit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ibkit.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- .Values.networkPolicy.ingress | toYaml | nindent 4 }}
{{- end }}
