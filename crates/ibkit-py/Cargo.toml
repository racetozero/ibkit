# This crate is deliberately NOT a member of the root Cargo workspace. Building
# a PyO3 crate's test harness links libpython, which is not present on every
# machine that runs `cargo test --workspace`. The empty `[workspace]` table below
# stops Cargo from walking up to the root manifest.
[workspace]

[package]
name = "ibkit-py"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/racetozero/ibkit"
description = "Python bindings for ibkit, a Rust rewrite of ib_async / ib_insync"

[lib]
name = "_ibkit"
crate-type = ["cdylib"]

[dependencies]
ibkit = { path = "../ibkit" }
ibkit-fix = { path = "../ibkit-fix" }
ibkit-web = { path = "../ibkit-web" }
ibkit-gateway-client = { path = "../ibkit-gateway-client" }
anyhow = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }

[profile.release]
lto = "fat"
codegen-units = 1
