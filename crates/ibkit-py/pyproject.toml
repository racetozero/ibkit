[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "ibkit"
requires-python = ">=3.11"
description = "Interactive Brokers TWS API, Web API and FIX client with a Rust core; a drop-in style replacement for ib_async and ib_insync"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ibkit contributors" }]
keywords = ["interactive-brokers", "ibkr", "tws", "trading", "ib_async", "ib_insync"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Office/Business :: Financial :: Investment",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/racetozero/ibkit"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
pandas = ["pandas>=2"]

[tool.maturin]
module-name = "ibkit._ibkit"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
