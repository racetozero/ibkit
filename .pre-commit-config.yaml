# Generated files (CI diffs them against a fresh run; the OpenAPI test
# compares the exact text) and Helm templates, which are not YAML.
exclude: |
  (?x)^(
    charts/[^/]+/templates/.*|
    crates/ibkit-gateway/openapi\.json|
    crates/ibkit-node/ts/(types|client_requests|gateway_types)\.ts|
    crates/ibkit-py/python/ibkit/(_types\.py|_gateway_types\.py|_ibkit\.pyi)
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.93.0
    hooks:
      - id: oxlint
        types_or: [javascript, ts, jsx, tsx, vue, svelte, astro]

  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.78.0 # Use the sha or tag you want to point at
    hooks:
      - id: oxfmt
        language_version: system
        types_or:
          [
            javascript,
            jsx,
            ts,
            tsx,
            json,
            json5,
            yaml,
            toml,
            html,
            vue,
            css,
            scss,
            less,
            markdown,
            mdx,
            graphql,
            handlebars,
          ]

  - repo: https://github.com/AndrejOrsula/pre-commit-cargo
    rev: 0.5.0
    hooks:
      - id: cargo-fmt
      - id: cargo-update
      - id: cargo-clippy
        args: ['--workspace', '--all-targets', '--all-features', '--', '-D', 'warnings']
